# /etc/psilinux/apk.conf - where apk (the Psion's wrapper, /usr/local/sbin/apk)
# finds Alpine's catalogue: a PsiProxy with its apk helper (psiapk.py). The
# packages are Alpine's own and their signatures are checked here, so the
# server needs no trust beyond that.
#
# Empty (as installed): apk uses the proxy set in the Psion's Connection
# settings (PsiTerm, PsiMail or PsiWeb), if it is on. Otherwise set it here,
# for example:  APK_SERVER=http://192.168.1.10:8081
APK_SERVER=
# APK_DIRECT=1 fetches the packages from Alpine's mirror instead (plain http:
# apk checks their signatures). The catalogue still comes from the server.
