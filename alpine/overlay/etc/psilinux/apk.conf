# /etc/psilinux/apk.conf - where apk (the Psion's wrapper, /usr/local/sbin/apk)
# finds Alpine's catalogue. Change it with: apk source
#
# APK_SOURCE: online   Alpine's online catalogue (recommended: no set-up)
#             psiproxy your own PsiProxy with its apk helper (APK_SERVER,
#                      else the proxy in the Psion's Connection settings)
#             none     no packages from the network
#             (empty)  a PsiProxy if Connection settings have one, else online
# The packages are Alpine's own and apk checks their signatures here, so no
# source needs trust beyond that.
APK_SOURCE=
# a PsiProxy's address, for example  APK_SERVER=http://192.168.1.10:8081
APK_SERVER=
# (rarely needed) the online catalogue, and Alpine's mirror for the packages:
# APK_CATALOGUE=https://danieledge.github.io/psilinux/apk/v3.24/armhf
# APK_MIRROR=https://dl-cdn.alpinelinux.org/alpine/v3.24
# APK_DIRECT=1 with a PsiProxy: packages from the mirror, not through it.
