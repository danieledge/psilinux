# psilinux.conf - ssh's settings for a Psion (PsiLinux; linux/docs/ALPINE.md,
# "ssh"). A 5mx does about 13 million instructions a second, through the
# translator, so the choices below are about time. Your own settings go in
# ~/.ssh/config (read first, so they win), or with -o on the command line.
Host *
	# The key exchange. OpenSSH 10 puts ML-KEM first, and it is quick here
	# (a login is about 12 s of work). Its second choice, sntrup761, is what
	# a server with OpenSSH 8.5 to 9.8 picks (most of them in 2026): about
	# 1.5 billion instructions, two minutes on a 5mx, which looks like a hang
	# and can outlast the server's login time limit. So it is left out: such
	# servers get curve25519 instead. (To have it: KexAlgorithms
	# +sntrup761x25519-sha512 in ~/.ssh/config.) The rest are for older servers.
	KexAlgorithms mlkem768x25519-sha256,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,diffie-hellman-group14-sha256
	# (curve25519 is not post-quantum, and OpenSSH would say so at every
	# login to such a server; the reason is above)
	WarnWeakCrypto no-pq-kex
	# Typing: OpenSSH sends keys at fixed 20 ms steps, and fake ones for a
	# while after (each answered by the server), so that their timing cannot
	# be seen: about three times the packets to encrypt, decrypt and send
	# over the Psion's link while you type. Keys are sent as they are typed.
	ObscureKeystrokeTiming no
	# Learning a server's other host keys rewrites known_hosts with a hard
	# link, which the Psion's disks do not have (and it is more work).
	UpdateHostKeys no
	# A word every minute, so that an idle session is noticed when the link
	# has gone (and a connection through a router is kept).
	ServerAliveInterval 60
	ServerAliveCountMax 3
